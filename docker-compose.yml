services:
  # 1. Base de Dados PostgreSQL 16 com Extensão Espacial PostGIS 3.4
  postgis:
    image: postgis/postgis:16-3.4
    container_name: angola_postgis_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-angola_geomarketing}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      # Scripts de migração e seeds executados por ordem alfabética no primeiro arranque:
      - ./database/01_schema_postgis.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed_angola_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./database/03_seed_municipios_angola.sql:/docker-entrypoint-initdb.d/03_municipios.sql:ro
      - ./database/04_carga_territorial_oficial.sql:/docker-entrypoint-initdb.d/04_carga_territorial.sql:ro
      - ./database/05_migration_fastapi_evidence.sql:/docker-entrypoint-initdb.d/05_evidencias.sql:ro
      - ./database/06_migration_fastapi_users.sql:/docker-entrypoint-initdb.d/06_usuarios.sql:ro
      - ./database/05_audit_logs.sql:/docker-entrypoint-initdb.d/05_audit.sql:ro
      - ./database/06_planos_comerciais.sql:/docker-entrypoint-initdb.d/06_planos.sql:ro
      - ./database/07_migration_rls_multi_tenancy.sql:/docker-entrypoint-initdb.d/07_rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rede_eleitoral

  # 2. Backend RESTful API em Python/FastAPI (Offline-First Sync & PostGIS)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: angola_backend_api
    volumes:
      - evidencias_data:/srv/data/storage
    restart: unless-stopped
    environment:
      APP_ENV: production
      API_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB:-angola_geomarketing}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY no .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8501}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - rede_eleitoral

  # 3. Sala de guerra em React. O nginx faz proxy de /api para o FastAPI.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: angola_war_room_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rede_eleitoral

  # 3b. Protótipo Streamlit. O cliente operacional é o serviço web.
  war-room:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: angola_war_room
    restart: unless-stopped
    environment:
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_HEADLESS: "true"
      API_BASE_URL: http://backend:8000/api
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - rede_eleitoral

  # 4. Simulador Mobile Interativo (Servidor Web Nginx)
  mobile-preview:
    image: nginx:alpine
    container_name: angola_mobile_preview
    restart: unless-stopped
    volumes:
      - ./mobile/preview.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "8080:80"
    networks:
      - rede_eleitoral

volumes:
  postgis_data:
    driver: local
  evidencias_data:
    driver: local

networks:
  rede_eleitoral:
    driver: bridge
