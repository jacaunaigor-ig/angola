[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#080D1A"
secondaryBackgroundColor = "#121B2F"
textColor = "#F8FAFC"
linkColor = "#7DD3FC"
borderColor = "#243049"
codeBackgroundColor = "#0E172A"
codeTextColor = "#E2E8F0"
redColor = "#F87171"
orangeColor = "#FB923C"
yellowColor = "#FBBF24"
greenColor = "#34D399"
blueColor = "#38BDF8"
violetColor = "#A78BFA"
grayColor = "#94A3B8"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap"
baseFontSize = 15
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
chartCategoricalColors = ["#38BDF8", "#34D399", "#FB923C", "#F87171", "#A78BFA", "#FBBF24", "#94A3B8"]
dataframeBorderColor = "#243049"
dataframeHeaderBackgroundColor = "#121B2F"

[theme.sidebar]
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#121B2F"
borderColor = "#243049"
primaryColor = "#38BDF8"
textColor = "#F8FAFC"
