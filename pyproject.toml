[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".venv-1", "angola", "node_modules", "mobile", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # comprimento tratado pelo formatador; textos em português são longos
    "B008",  # Depends()/Query() em argumentos é o padrão do FastAPI
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/conftest.py" = ["E402"]
"backend/tests/test_contract_unit.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
