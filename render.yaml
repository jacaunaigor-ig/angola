# ==============================================================================
# RENDER.COM BLUEPRINT - DEPLOYMENT EM NUVEM AUTOMATIZADO
# ==============================================================================
services:
  # 1. Backend RESTful API (FastAPI)
  - type: web
    name: angola-geomarketing-api
    env: docker
    region: frankfurt
    plan: starter
    # A API importa war_room/ e lê data/raw/: o contexto tem de ser a raiz do repositório.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    disk:
      name: evidencias
      mountPath: /srv/data/storage
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: angola-postgis-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # 2. War Room Executivo (Streamlit)
  - type: web
    name: angola-war-room-dashboard
    env: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: API_BASE_URL
        value: https://angola-geomarketing-api.onrender.com/api
      - key: API_AUTH_TOKEN
        sync: false

  # 3. Simulador Mobile (Static Site)
  - type: web
    name: angola-mobile-simulator
    env: static
    region: frankfurt
    plan: free
    rootDir: mobile
    staticPublishPath: .

databases:
  # Base de Dados Gerenciada com PostGIS
  - name: angola-postgis-db
    region: frankfurt
    plan: starter
    postgresMajorVersion: 16
    databaseName: angola_geomarketing
    user: angola_admin
