# ==============================================================================
# RENDER.COM BLUEPRINT - DEPLOYMENT EM NUVEM AUTOMATIZADO
# ==============================================================================
services:
  # 1. Backend RESTful API (Node.js)
  - type: web
    name: angola-geomarketing-api
    env: node
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: angola-postgis-db
          property: connectionString

  # 2. War Room Executivo (Streamlit)
  - type: web
    name: angola-war-room-dashboard
    env: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"

  # 3. Simulador Mobile (Static Site)
  - type: web
    name: angola-mobile-simulator
    env: static
    region: frankfurt
    plan: free
    rootDir: mobile
    staticPublishPath: .

databases:
  # Base de Dados Gerenciada com PostGIS
  - name: angola-postgis-db
    region: frankfurt
    plan: starter
    postgresMajorVersion: 16
    databaseName: angola_geomarketing
    user: angola_admin
