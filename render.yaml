# ==============================================================================
# RENDER.COM BLUEPRINT - DEPLOYMENT EM NUVEM AUTOMATIZADO
# ==============================================================================
services:
  # 1. Backend RESTful API (FastAPI)
  - type: web
    name: angola-geomarketing-api
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    branch: feat/produto-venda
    # A API importa war_room/ e lê data/raw/: o contexto tem de ser a raiz do repositório.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    disk:
      name: evidencias
      mountPath: /srv/data/storage
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: angola-postgis-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://angola-war-room-dashboard.onrender.com

  # 2. Sala de comando (React). O nginx faz proxy de /api para a API FastAPI.
  - type: web
    name: angola-war-room-dashboard
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    branch: feat/produto-venda
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM
        value: angola-geomarketing-api:10000

  # 3. Simulador Mobile (Static Site)
  - type: web
    name: angola-mobile-simulator
    runtime: static
    branch: feat/produto-venda
    rootDir: mobile
    staticPublishPath: .

databases:
  # Base de Dados Gerenciada com PostGIS
  - name: angola-postgis-db
    region: frankfurt
    plan: 0.5c-1g
    postgresMajorVersion: 16
    databaseName: angola_geomarketing
    user: angola_admin
