# ==============================================================================
# RENDER.COM BLUEPRINT - DEPLOYMENT EM NUVEM AUTOMATIZADO
# ==============================================================================
services:
  # 1. Backend RESTful API (FastAPI)
  - type: web
    name: angola-geomarketing-api
    runtime: docker
    region: frankfurt
    plan: free
    branch: feat/produto-venda
    # A API importa war_room/ e lê data/raw/: o contexto tem de ser a raiz do repositório.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    initialDeployHook: python bootstrap_database.py
    # No plano gratuito, os ficheiros locais de evidência não são persistentes.
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: angola-postgis-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://angola-war-room-dashboard.onrender.com

  # 2. Sala de comando React como site estático; a API é chamada diretamente.
  - type: web
    name: angola-war-room-dashboard
    runtime: static
    branch: feat/produto-venda
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_ORIGIN
        value: https://angola-geomarketing-api.onrender.com
      - key: VITE_DEMO_MODE
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Simulador Mobile (Static Site)
  - type: web
    name: angola-mobile-simulator
    runtime: static
    branch: feat/produto-venda
    rootDir: mobile
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /
        destination: /preview.html

databases:
  # Base de Dados Gerenciada com PostGIS
  - name: angola-postgis-db
    region: frankfurt
    plan: free
    postgresMajorVersion: 16
    databaseName: angola_geomarketing
    user: angola_admin
