name: CI - GPS de Marketing Político Angola 2027

on:
  push:
    branches: [ main, feat/plataforma-v2 ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: API, motor político e testes
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: angola_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d angola_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/angola_test
      OTEL_EXPORTER_OTLP_ENDPOINT: ""

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements-dev.txt
            requirements.txt

      - name: Instalar dependências Python
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install -r requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check backend/app backend/tests war_room

      - name: Pipeline ETL territorial
        run: node scripts/etl_territorial.js

      - name: Testes do fluxo legado (Node)
        run: |
          node tests/test_fluxo_completo.js
          node tests/test_outbox_e_idempotencia.js
          node tests/test_planos_comerciais.js

      - name: Testes do motor analítico (Python)
        run: python -m unittest tests/test_anomalias_campo.py tests/test_planos_comerciais.py

      - name: Compilação dos módulos Python
        run: |
          python -m py_compile app.py api_client.py boot.py backend/boot.py backend/create_user.py
          python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for base in ('backend/app', 'backend/tests', 'pages', 'war_room') for p in pathlib.Path(base).rglob('*.py')]"

      - name: Testes de contrato e integração FastAPI + PostGIS
        run: python -m pytest backend/tests

      - name: Coerência das dependências
        run: python -m pip check

  web:
    name: Sala de comando (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Build de produção
        run: npm run build

  mobile:
    name: Aplicação móvel (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Validar bundle Expo Android
        run: npx expo export --platform android

  imagens:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da API (contexto na raiz)
        run: docker build -f backend/Dockerfile -t angola-api:ci .
      - name: A imagem importa a aplicação sem base de dados
        run: docker run --rm angola-api:ci python -c "from app.main import create_app; create_app().openapi()"
      - name: Build da sala de comando
        run: docker build -t angola-web:ci web
